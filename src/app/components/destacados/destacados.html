<section class="container my-5">
  <h3 class="fw-bold text-center mb-4 text-secondary">DESTACADOS</h3>

  <div
    id="destacadosCarousel"
    class="carousel slide shadow rounded overflow-hidden"
    data-bs-ride="carousel"
  >
    <div class="carousel-inner">
      @for (destacado of destacados; track destacado.imagen) {
        <div class="carousel-item" [class.active]="$first">
          <a [href]="destacado.enlace" target="_blank" rel="noopener">
            <img [src]="destacado.imagen" class="d-block w-100" [alt]="destacado.alt" />
          </a>
        </div>
      }
    </div>

    <button
      class="carousel-control-prev"
      type="button"
      data-bs-target="#destacadosCarousel"
      data-bs-slide="prev"
    >
      <span class="carousel-control-prev-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
    </button>
    <button
      class="carousel-control-next"
      type="button"
      data-bs-target="#destacadosCarousel"
      data-bs-slide="next"
    >
      <span class="carousel-control-next-icon bg-dark rounded-circle p-3" aria-hidden="true"></span>
    </button>
  </div>
</section>
