<section class="container mb-5" id="servicios">
  @for (categoria of categorias; track categoria.titulo) {
    <h4 class="fw-bold mb-4 border-bottom pb-2" [class]="categoria.colorTitulo">
      {{ categoria.titulo }}
    </h4>

    <div class="row g-4 text-center" [class.mb-5]="!$last">
      @for (servicio of categoria.servicios; track servicio.titulo) {
        <div [class]="categoria.columna">
          <a
            [href]="servicio.enlace"
            [attr.target]="esExterno(servicio.enlace) ? '_blank' : null"
            [attr.rel]="esExterno(servicio.enlace) ? 'noopener' : null"
            class="text-decoration-none text-dark card-servicio p-3 d-block border rounded bg-white shadow-sm"
          >
            <i
              [class]="
                'bi ' + servicio.icono + ' ' + categoria.escalaIcono + ' ' + servicio.colorIcono
              "
            ></i>
            <p class="mt-2 mb-0 fw-bold" [style.font-size]="categoria.tamanoTitulo">
              {{ servicio.titulo }}
            </p>
          </a>
        </div>
      }
    </div>
  }
</section>
